name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: website-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run docs:build

      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD)"
          rm -rf /tmp/gh-pages
          if git show-ref --quiet refs/remotes/origin/gh-pages; then
            git worktree add -f /tmp/gh-pages origin/gh-pages
            cd /tmp/gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            mkdir -p /tmp/gh-pages
            cd /tmp/gh-pages
            git init -q -b gh-pages
          fi
          rm -rf ./* ./.nojekyll 2>/dev/null || true
          cp -r "$GITHUB_WORKSPACE/website/.vitepress/dist/." .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "No website changes to publish."
          else
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "Website for ${COMMIT}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          fi
